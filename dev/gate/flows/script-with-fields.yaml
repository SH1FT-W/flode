# A script: fields with selectors, a condition step, templated data, an if/else.
alias: Script with fields
description: Script whose fields feed its steps
icon: mdi:weather-sunset-up
mode: restart
fields:
  brightness:
    name: Brightness
    description: How bright the kitchen gets
    required: true
    default: 60
    selector:
      number:
        min: 1
        max: 100
  announce:
    name: Announce
    default: false
    selector:
      boolean: {}
sequence:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: "off"
  - action: light.turn_on
    target:
      entity_id: light.kitchen_lights
    data:
      brightness_pct: "{{ brightness }}"
  - delay: "00:00:05"
  - if:
      - condition: template
        value_template: "{{ announce }}"
    then:
      - action: notify.persistent_notification
        data:
          message: Kitchen is on
    else:
      - action: light.turn_on
        target:
          entity_id: light.ceiling_lights
