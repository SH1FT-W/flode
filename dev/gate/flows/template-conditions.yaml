# Templates everywhere a condition or a value can be one.
alias: Template conditions
description: Template condition at the root and as a step, wait_template, templated delay and data
triggers:
  - trigger: numeric_state
    entity_id: sensor.outside_temperature
    above: 25
conditions:
  - condition: template
    value_template: "{{ now().hour >= 8 and now().hour < 22 }}"
actions:
  - condition: template
    value_template: "{{ is_state('light.kitchen_lights', 'off') }}"
  - action: light.turn_on
    target:
      entity_id: light.kitchen_lights
    data:
      brightness_pct: "{{ 100 - (states('sensor.outside_temperature') | int(0)) }}"
  - wait_template: "{{ is_state('binary_sensor.movement_backyard', 'off') }}"
    timeout: "00:10:00"
    continue_on_timeout: true
  - delay: "{{ states('input_number.pause') | int(30) }}"
  - action: light.turn_off
    target:
      entity_id: light.kitchen_lights
mode: single
