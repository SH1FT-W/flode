# An or in the middle of the flow: a step before, then and else, a step after.
alias: Or in the middle of the flow
description: Step, if with or and both branches, step after
triggers:
  - trigger: state
    entity_id: binary_sensor.movement_backyard
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.entrance_color_white_lights
  - if:
      - condition: or
        conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          - condition: numeric_state
            entity_id: sensor.outside_temperature
            below: 5
    then:
      - action: light.turn_on
        target:
          entity_id: light.ceiling_lights
        data:
          brightness_pct: 100
    else:
      - action: light.turn_on
        target:
          entity_id: light.ceiling_lights
        data:
          brightness_pct: 30
  - delay:
      minutes: 10
  - action: light.turn_off
    target:
      entity_id: light.ceiling_lights
mode: restart
