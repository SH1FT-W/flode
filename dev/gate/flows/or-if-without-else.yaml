# An or as the first step of the flow, Yes path only (no shared else).
alias: Or at the start without else
description: If with an or condition as the first step, no else branch
triggers:
  - trigger: state
    entity_id: binary_sensor.movement_backyard
    to: "on"
actions:
  - if:
      - condition: or
        conditions:
          - condition: state
            entity_id: light.kitchen_lights
            state: "off"
          - condition: numeric_state
            entity_id: sensor.outside_temperature
            below: 10
    then:
      - action: light.turn_on
        target:
          entity_id: light.kitchen_lights
mode: single
