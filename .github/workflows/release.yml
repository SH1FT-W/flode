name: Release

on:
  release:
    types: [published]
  # Manueller Start nur zum erneuten Hochladen: im "Use workflow from"-Feld
  # den Release-Tag waehlen, ein Branch wird vom Guard unten abgelehnt.
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag and versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release muss von einem Tag laufen, nicht von '$TAG' ($REF_TYPE)"
            exit 1
          fi
          VERSION="${TAG#v}"
          MANIFEST=$(jq -r .version custom_components/flode/manifest.json)
          FRONTEND=$(jq -r .version packages/frontend/package.json)
          echo "Tag: $VERSION, manifest.json: $MANIFEST, frontend/package.json: $FRONTEND"
          if [ "$VERSION" != "$MANIFEST" ] || [ "$VERSION" != "$FRONTEND" ]; then
            echo "::error::Versionen passen nicht zum Tag $TAG"
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @flode/shared build

      - name: Build transpiler package
        run: yarn workspace @flode/transpiler build

      - name: Build UI core package
        run: yarn workspace @flode/ui-core build

      - name: Build frontend
        run: yarn workspace @flode/frontend build

      - name: Verify www directory
        run: |
          ls -la custom_components/flode/
          ls -la custom_components/flode/www/
          test -f custom_components/flode/www/flode-panel.js

      - name: Create release archive
        run: |
          cd custom_components/flode
          zip -r ../../flode.zip . -x "*.DS_Store"
          tar -czf ../../flode.tar.gz --exclude="*.DS_Store" .
          cd ../..
          echo "Archive erstellt:"
          ls -la *.zip *.tar.gz

      - name: Extract Changelog section
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            flode.zip
            flode.tar.gz
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
